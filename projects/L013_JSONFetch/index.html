<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/casino" rel="stylesheet">
</head>
<body>

    <h1>Blackjack Game</h1>

    <div class="bot-container">
        <div class="info">
                <p>Balance: $<span id="balanceDisplay">1000</span></p> <p>Bet: </p>
                <select name="bet" id="betSelect">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="500">500</option>
                </select>
        </div>

        <div id="dealer-hand" class="hand"></div>

        <div class="info2">
            <h2>Score</h2>
            <p>Dealer: <span id="dealerScore">0</span></p>
            <p>Player: <span id="playerScore">0</span></p>
        </div>
    </div>

    <h2 id="gameMessage">Choose the bet and press New Game!</h2>

    <div class="player-container">
        <button id="hitButton" disabled>Hit</button>
        <div id="player-hand" class="hand"></div>
        <button id="standButton" disabled>Stand</button>
    </div>

    <div class="action-container">
        <button id="NewGameButton">New Game</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
